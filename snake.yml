name: Generate Contribution Snake

on:
  # Jalankan otomatis setiap hari pukul 00:00 UTC (07:00 WIB)
  schedule:
    - cron: "0 0 * * *"

  # Bisa dijalankan manual dari tab Actions di GitHub
  workflow_dispatch:

  # Otomatis jalan saat ada push ke branch main
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#F59E0B&color_dots=#141414,#0D3B36,#136A60,#1FA394,#2DD4BF

      - name: Push github-contribution-grid-snake-dark.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
